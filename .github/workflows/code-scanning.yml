name: RunbookProof Code Scanning

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: runbookproof-code-scanning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true

      - name: Generate RunbookProof SARIF
        id: scan
        shell: bash
        run: |
          set +e

          uvx --from . runbookproof scan . \
            --format sarif \
            --output runbookproof.sarif

          scan_exit_code=$?
          set -e

          echo "exit_code=$scan_exit_code" >> "$GITHUB_OUTPUT"

          if [ "$scan_exit_code" -gt 1 ]; then
            echo "RunbookProof could not complete the scan." >&2
            exit "$scan_exit_code"
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: >-
          always() &&
          steps.scan.outcome == 'success' &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name ==
            github.repository
          )
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: runbookproof.sarif
          category: runbookproof

      - name: Fail on error-level findings
        if: steps.scan.outputs.exit_code == '1'
        shell: bash
        run: |
          echo "RunbookProof detected error-level findings."
          exit 1
