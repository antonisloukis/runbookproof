name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(uv version --short)"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match ${expected_tag}." >&2
            exit 1
          fi

          if ! grep -Fq "## [${package_version}]" CHANGELOG.md; then
            echo "CHANGELOG.md does not document ${package_version}." >&2
            exit 1
          fi

      - name: Build distributions
        run: |
          rm -rf dist
          uv build --no-sources

      - name: Verify distribution contents
        run: uv run python scripts/check_distribution.py

      - name: Smoke-test wheel
        shell: bash
        run: |
          set -euo pipefail

          uv venv --python 3.11 .release-venv

          uv pip install             --python .release-venv/bin/python             dist/*.whl

          .release-venv/bin/runbookproof --version

          .release-venv/bin/runbookproof             rules             --format json             > /tmp/runbookproof-rules.json

          python -m json.tool             /tmp/runbookproof-rules.json             > /dev/null

          .release-venv/bin/runbookproof             scan README.md

      - name: Publish distributions to PyPI
        run: uv publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create             "${GITHUB_REF_NAME}"             dist/*             --verify-tag             --generate-notes             --title "RunbookProof ${GITHUB_REF_NAME}"
